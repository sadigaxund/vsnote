name: CI

# Phase 13 (docs/IMPLEMENTATION-PLAN-V2.md). Two jobs:
#   `test`  — on every push/PR to main: lint, typecheck, build, vitest, the
#             Playwright e2e suite, and the server pytest suite.
#   `pages` — main-only, after `test` is green: builds the SPA with a
#             `/vsnote/` base path and deploys it to GitHub Pages. The demo
#             is client-only — no backend is deployed anywhere by this
#             workflow. See vite.config.ts's `SLATE_BASE_PATH` handling and
#             docs/ARCHITECTURE.md's base-path note.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (a new push obsoletes the old one),
# but never cancel a `pages` deploy already in flight — see that job's own
# concurrency group below, which is deliberately separate from this one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Playwright/vite preview use fixed, suite-owned ports (see
  # playwright.config.ts / tests/e2e/shareFixtures.ts) — 5290 (vite preview)
  # and 8788 (the e2e suite's own spawned backend). Nothing in this workflow
  # hardcodes a developer machine's ports (5173, 8787); those never appear
  # here.
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  test:
    name: Lint, typecheck, build, and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: server/requirements.txt

      # CRITICAL ordering note: tests/e2e/globalSetup.ts spawns the share
      # backend via the literal path `server/.venv/bin/python`. That venv
      # MUST exist, with server/requirements.txt installed, before the
      # Playwright step below runs, or every backend-dependent spec fails at
      # globalSetup (not a normal per-spec failure — the whole e2e run dies
      # before any test executes). Building it here, right after npm deps
      # and before lint/build/vitest, means it's ready long before we reach
      # the e2e step, and a broken venv fails fast instead of after a slow
      # lint+build+vitest pass.
      - name: Create server virtualenv and install requirements
        run: |
          python3 -m venv server/.venv
          server/.venv/bin/pip install --upgrade pip
          server/.venv/bin/pip install -r server/requirements.txt

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build (default base path, unchanged local behavior)
        run: npm run build

      - name: Unit tests (vitest)
        run: npm run test:unit
        env:
          CI: true

      # Suite is chromium-only (playwright.config.ts has a single "chromium"
      # project) so we only ever install that one browser.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Worker count: playwright.config.ts already sets `workers: 2` whenever
      # CI=true (GitHub Actions sets this env var automatically), which is
      # what `--workers=2` below makes explicit rather than relying on an
      # implicit env check alone — ubuntu-latest runners are 4-core, and this
      # suite spawns a real vite-preview server plus a real uvicorn backend
      # alongside the Chromium workers, so 2 workers leaves headroom instead
      # of fighting itself for CPU/port contention (the task brief flags this
      # suite as contention-sensitive; over-parallelizing here has cost real
      # wall-clock time in local runs).
      #
      # Retries: playwright.config.ts sets `retries: 0` unconditionally, in
      # CI and locally alike — deliberately, not an oversight. Nothing at
      # this workflow level adds retry logic on top (no wrapper script, no
      # `continue-on-error`). Locally, under CI=true, the suite is 157
      # vitest + 90 playwright with ZERO failures, so there is no
      # currently-named flake to spend a retry budget on. Concretely: the
      # live-preview defect fixed in commit 834063d presented as an
      # intermittent e2e failure — with retries enabled, CI would have
      # failed that spec once, passed on the retry, and reported green
      # while real users kept seeing raw markdown that never resolved on
      # load. A retry budget with no named flake behind it is a mechanism
      # for hiding exactly that class of bug. If a specific spec is later
      # found to flake on the runner (not reproducible locally), justify it
      # by name, right here, before raising retries above 0.
      - name: E2E tests (Playwright)
        run: npm run test:e2e -- --workers=2
        env:
          CI: true

      - name: Server tests (pytest)
        working-directory: server
        run: .venv/bin/python -m pytest tests -q

  pages:
    name: Deploy GitHub Pages demo
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # SLATE_BASE_PATH feeds vite's `base` (see vite.config.ts) and, through
      # it, the PWA manifest's start_url/scope/icon `src` fields and the
      # service worker's registration/precache scope — all of it derived
      # from this one env var rather than assuming Pages serves from `/`.
      # Local dev/build (no env var set) is unaffected: vite.config.ts
      # defaults SLATE_BASE_PATH to "/".
      - name: Build for GitHub Pages
        run: npm run build
        env:
          SLATE_BASE_PATH: /vsnote/

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
