# Phase 14 (docs/IMPLEMENTATION-PLAN-V2.md). One service, one image, one
# process — single-origin (docs/ROADMAP-SHARING-AUTH.md §5.4): this process
# serves the SPA + /api + /share/* + /git/* on one port. Copy .env.example
# to .env and edit before running for real; every value below has a sane
# dev-safe default so `docker compose up --build` also works with no .env
# at all.
#
# Quick start:
#   docker compose up -d --build
#   # → http://localhost:8787/  (or ${VSNOTE_HOST_PORT} if you changed it)
#
# Factory reset (destroys the DB and every synced git repo — see the
# `volumes:` block below):
#   docker compose down -v

services:
  vsnote:
    build:
      context: .
      dockerfile: Dockerfile
    image: vsnote:latest
    container_name: vsnote

    # Host port is configurable (default 8787) — the brief calls this out
    # explicitly since 8787 may already be bound to something else on a
    # given host; VSNOTE_HOST_PORT is the escape hatch, left as the
    # left-hand side so it never has to match the in-container port.
    # VSNOTE_PORT (right-hand side) is also configurable, in case the
    # in-container bind port itself ever needs to move — it flows straight
    # through to the same env var app/config.py reads and the Dockerfile's
    # CMD binds to.
    ports:
      - "${VSNOTE_HOST_PORT:-8787}:${VSNOTE_PORT:-8787}"

    environment:
      # --- every VSNOTE_* setting server/app/config.py reads, passed
      # through with the exact same defaults config.py itself would use if
      # the var were unset (see server/.env.example for the annotated,
      # single source of truth on what each one means) ---
      VSNOTE_ENV: ${VSNOTE_ENV:-prod}
      VSNOTE_PORT: ${VSNOTE_PORT:-8787}
      # NOT app/config.py's own default (sqlite:///./vsnote.db) — that path
      # is relative to a CWD this container doesn't use the same way local
      # dev does. Pointed at the named volume mounted below so the DB
      # survives container recreation. Override only if you know the new
      # path is still under a mounted volume.
      VSNOTE_DB_URL: ${VSNOTE_DB_URL:-sqlite:////data/db/vsnote.db}
      # REQUIRED for a real deployment (VSNOTE_ENV=prod) — left unset here
      # so an unconfigured `docker compose up` fails LOUDLY at startup
      # (app/config.py::resolve_secret_key) rather than silently running
      # prod on an ephemeral, restart-invalidated dev key. Generate one
      # with: python3 -c "import secrets; print(secrets.token_urlsafe(32))"
      VSNOTE_SECRET_KEY: ${VSNOTE_SECRET_KEY:-}
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:-}
      VSNOTE_MAX_BLOB_BYTES: ${VSNOTE_MAX_BLOB_BYTES:-5242880}
      # Not app/config.py's own default (./git-repos) for the same
      # CWD/ownership reason as VSNOTE_DB_URL above — /data/git-repos is the
      # named volume mounted below.
      VSNOTE_GIT_ROOT: ${VSNOTE_GIT_ROOT:-/data/git-repos}
      # Phase 17 — server-mounted, AUTHORITATIVE vault. Empty by default,
      # same as VSNOTE_SECRET_KEY above: an unset value here means "legacy
      # shape, no change from Phase 11/14" (the vault is just the ordinary
      # bare repo under VSNOTE_GIT_ROOT). Set in .env to
      # VSNOTE_VAULT_PATH=/data/vault to opt in — matches the commented
      # `vsnote-vault` volume mount below, which you must also uncomment.
      # See server/README.md's "Server-mounted vault" section: a fresh
      # mount needs one explicit POST /api/vault/init call before use, and
      # an existing repo already at the mount is always respected.
      VSNOTE_VAULT_PATH: ${VSNOTE_VAULT_PATH:-}
      # The repo name clients use in <origin>/git/<name>.git to reach the
      # vault (whichever shape it is above). Only change together with the
      # client's own "Repository name" setting.
      VSNOTE_VAULT_REPO_NAME: ${VSNOTE_VAULT_REPO_NAME:-vault}
      VSNOTE_RATE_LIMIT_DEFAULT: ${VSNOTE_RATE_LIMIT_DEFAULT:-120/minute}
      VSNOTE_RATE_LIMIT_SHARE: ${VSNOTE_RATE_LIMIT_SHARE:-60/minute}
      VSNOTE_RATE_LIMIT_SHARE_AUTH: ${VSNOTE_RATE_LIMIT_SHARE_AUTH:-5/minute}
      VSNOTE_SESSION_TTL_MIN: ${VSNOTE_SESSION_TTL_MIN:-30}
      # Phase 17 app-wide login gate. Default True: the shell is gated as
      # soon as a credential path exists (a local account or CF_ACCESS_*),
      # and never gated when neither does, so a first boot is not a
      # lockout. See server/README.md's "App-wide login gate" section.
      VSNOTE_REQUIRE_LOGIN: ${VSNOTE_REQUIRE_LOGIN:-True}
      # Secure-by-default (real HTTPS deployments, e.g. behind any reverse
      # proxy or tunnel — server/README.md). Set False in .env ONLY to test
      # over plain http://localhost.
      VSNOTE_COOKIE_SECURE: ${VSNOTE_COOKIE_SECURE:-True}
      # Phase 12 fallback-login onboarding (server/README.md) — unset by
      # default (a no-op); set BOTH together in .env to get a working
      # account on first boot. Never logged; never baked into the image.
      VSNOTE_BOOTSTRAP_USER: ${VSNOTE_BOOTSTRAP_USER:-}
      VSNOTE_BOOTSTRAP_PASSWORD: ${VSNOTE_BOOTSTRAP_PASSWORD:-}

    # Named volumes for ALL persistent state — nothing this process writes
    # at runtime lives outside one of these two. `docker compose down` (no
    # `-v`) leaves both intact; `docker compose down -v` is the deliberate
    # factory reset (destroys the DB — all shares/tokens/users — and every
    # bare git repo under VSNOTE_GIT_ROOT).
    volumes:
      - vsnote-db:/data/db
      - vsnote-git-repos:/data/git-repos
      # Phase 17 — server-mounted vault (opt-in). Uncomment both this mount
      # AND the matching named volume below (or point at a host path
      # instead, e.g. "/srv/my-notes:/data/vault") once VSNOTE_VAULT_PATH
      # above is also set to /data/vault. Left commented by default so the
      # legacy (bare-repo) shape stays the out-of-the-box behavior.
      # - vsnote-vault:/data/vault

    # No dedicated /healthz route exists in this backend (confirmed against
    # server/app/main.py and every router under server/app/routers/) — `GET
    # /` is used instead: it's the real single-origin front door (the exact
    # path a Cloudflare tunnel/browser hits first), only returns 200 once
    # create_app() has fully booted (engine, table creation, bootstrap_user,
    # dist/ discovery) without raising, and genuinely reflects "serving
    # traffic" rather than merely "process started". Uses python's stdlib
    # (urllib) instead of curl/wget — neither is installed in python:3.12-
    # slim and the image deliberately doesn't add one just for this.
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import os,urllib.request; urllib.request.urlopen(f\"http://127.0.0.1:{os.environ.get('VSNOTE_PORT','8787')}/\", timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped

volumes:
  vsnote-db:
  vsnote-git-repos:
  # Phase 17 — server-mounted vault (opt-in, see the commented mount +
  # VSNOTE_VAULT_PATH above). Declared even while unused so uncommenting
  # the mount above is a one-line change; an unused named volume costs
  # nothing.
  vsnote-vault:
